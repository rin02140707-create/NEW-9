<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>9月中秋抽獎樂</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff8e7, #ffe8b8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 430px;
    background: white;
    border-radius: 28px;
    padding: 35px 22px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.moon {
    font-size: 55px;
    margin-bottom: 5px;
}

.title {
    font-size: 36px;
    font-weight: 900;
    color: #b66a00;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 18px;
    color: #777;
    margin-bottom: 25px;
}

.rule {
    background: #fff5d6;
    border-radius: 16px;
    padding: 18px 10px;
    font-size: 20px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.rule strong {
    color: #d2691e;
    font-size: 30px;
}

.draw-btn {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: 11px solid #ffd166;
    background: #d97706;
    color: white;
    font-size: 30px;
    font-weight: 900;
    box-shadow: 0 10px 25px rgba(217,119,6,0.35);
    cursor: pointer;
    transition: transform 0.15s;
}

.draw-btn:active {
    transform: scale(0.93);
}

.draw-btn:disabled {
    background: #aaa;
    border-color: #ddd;
    box-shadow: none;
}

.result {
    min-height: 130px;
    margin-top: 30px;
    font-size: 24px;
    font-weight: bold;
}

.prize {
    display: block;
    font-size: 64px;
    color: #d2691e;
    margin-top: 10px;
    animation: pop 0.5s ease;
}

@keyframes pop {
    0% {
        transform: scale(0);
    }
    70% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
    }
}

.reset-btn {
    display: none;
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: none;
    border-radius: 14px;
    background: #555;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.notice {
    margin-top: 25px;
    color: #999;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="moon">🌕 🐇</div>

    <div class="title">
        9月中秋抽獎樂
    </div>

    <div class="subtitle">
        中秋好運・幸運抽折扣
    </div>

    <div class="rule">
        單筆消費滿
        <strong>$888</strong>
        <br>
        即可獲得 1 次抽獎機會
    </div>

    <button
        class="draw-btn"
        id="drawButton"
        onclick="drawPrize()"
    >
        START
        <br>
        開始抽獎
    </button>

    <div
        class="result"
        id="result">
    </div>

    <button
        class="reset-btn"
        id="resetButton"
        onclick="nextCustomer()"
    >
        下一位顧客
    </button>

    <div class="notice">
        每次抽獎完成後，請由現場人員操作下一位顧客
    </div>

</div>

<script>

let isDrawing = false;
let hasDrawn = false;

function drawPrize() {

    if (isDrawing || hasDrawn) {
        return;
    }

    isDrawing = true;

    const button = document.getElementById("drawButton");
    const result = document.getElementById("result");

    button.disabled = true;

    result.innerHTML = "🌕 好運抽獎中... 🐇";

    setTimeout(function() {

        /*
        中秋抽獎機率

        89折：70%
        79折：30%

        合計：100%
        */

        const random = Math.random() * 100;

        let prize;

        if (random < 70) {
            prize = "89 折";
        } else {
            prize = "79 折";
        }

        result.innerHTML =
            "🎉 恭喜抽中 🎉" +
            "<span class='prize'>" +
            prize +
            "</span>";

        hasDrawn = true;
        isDrawing = false;

        document.getElementById(
            "resetButton"
        ).style.display = "block";

    }, 2000);
}

function nextCustomer() {

    hasDrawn = false;
    isDrawing = false;

    document.getElementById(
        "result"
    ).innerHTML = "";

    document.getElementById(
        "drawButton"
    ).disabled = false;

    document.getElementById(
        "resetButton"
    ).style.display = "none";
}

</script>

</body>
</html>
