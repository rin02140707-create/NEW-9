<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>周年慶幸運抽獎</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff4e6, #ffe1e8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 430px;
    background: white;
    border-radius: 28px;
    padding: 35px 22px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.title {
    font-size: 36px;
    font-weight: 900;
    color: #c62828;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 18px;
    color: #777;
    margin-bottom: 25px;
}

.rule {
    background: #fff4dc;
    border-radius: 16px;
    padding: 18px 10px;
    font-size: 20px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.rule strong {
    color: #d62828;
    font-size: 30px;
}

.draw-btn {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: 11px solid #ffd166;
    background: #d62828;
    color: white;
    font-size: 30px;
    font-weight: 900;
    box-shadow: 0 10px 25px rgba(214,40,40,0.35);
    cursor: pointer;
    transition: transform 0.15s;
}

.draw-btn:active {
    transform: scale(0.93);
}

.draw-btn:disabled {
    background: #aaa;
    border-color: #ddd;
    box-shadow: none;
}

.result {
    min-height: 130px;
    margin-top: 30px;
    font-size: 24px;
    font-weight: bold;
}

.prize {
    display: block;
    font-size: 64px;
    color: #d62828;
    margin-top: 10px;
    animation: pop 0.5s ease;
}

@keyframes pop {
    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

.reset-btn {
    display: none;
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: none;
    border-radius: 14px;
    background: #444;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.notice {
    margin-top: 25px;
    color: #999;
    font-size: 13px;
}

</style>
</head>


<body>

<div class="container">

    <div class="title">
        🎉 周年慶 🎉
    </div>

    <div class="subtitle">
        LUCKY DRAW
    </div>


    <div class="rule">
        單筆消費滿
        <strong>$888</strong>
        <br>
        即可獲得 1 次抽獎機會
    </div>


    <button
        class="draw-btn"
        id="drawButton"
        onclick="drawPrize()"
    >
        START
        <br>
        開始抽獎
    </button>


    <div
        class="result"
        id="result">
    </div>


    <button
        class="reset-btn"
        id="resetButton"
        onclick="nextCustomer()"
    >
        下一位顧客
    </button>


    <div class="notice">
        每次抽獎完成後，請由現場人員操作下一位顧客
    </div>

</div>


<script>

let isDrawing = false;
let hasDrawn = false;


function drawPrize() {

    // 防止連續點擊
    if (isDrawing || hasDrawn) {
        return;
    }


    isDrawing = true;


    const button =
        document.getElementById("drawButton");

    const result =
        document.getElementById("result");


    button.disabled = true;

    result.innerHTML =
        "✨ 幸運抽獎中... ✨";


    // 等待 2 秒後公布結果
    setTimeout(function() {


        /*
        ==========================
        抽獎機率
        ==========================

        89 折：70%
        79 折：15%
        69 折：10%
        59 折：5%

        合計：100%
        */


        const random =
            Math.random() * 100;


        let prize;


        if (random < 70) {

            prize = "89 折";

        }

        else if (random < 85) {

            prize = "79 折";

        }

        else if (random < 95) {

            prize = "69 折";

        }

        else {

            prize = "59 折";

        }


        result.innerHTML =
            "🎊 恭喜獲得 🎊" +
            "<span class='prize'>" +
            prize +
            "</span>";


        hasDrawn = true;
        isDrawing = false;


        // 顯示下一位顧客
        document.getElementById(
            "resetButton"
        ).style.display = "block";


    }, 2000);

}



function nextCustomer() {

    hasDrawn = false;
    isDrawing = false;


    document.getElementById(
        "result"
    ).innerHTML = "";


    document.getElementById(
        "drawButton"
    ).disabled = false;


    document.getElementById(
        "resetButton"
    ).style.display = "none";

}

</script>

</body>
</html>
