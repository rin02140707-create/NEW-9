<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>9月幸運抽獎</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff3e8, #ffe5e5);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 450px;
    background: white;
    border-radius: 25px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.title {
    font-size: 34px;
    font-weight: 900;
    color: #c62828;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 18px;
    color: #555;
    margin-bottom: 25px;
}

.rule {
    background: #fff5e6;
    border-radius: 15px;
    padding: 15px;
    font-size: 20px;
    margin-bottom: 20px;
}

.rule strong {
    color: #d32f2f;
    font-size: 26px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 24px;
    border: 2px solid #ddd;
    border-radius: 12px;
    text-align: center;
    outline: none;
}

input:focus {
    border-color: #d32f2f;
}

.confirm-btn {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    background: #333;
    color: white;
}

.chance {
    font-size: 20px;
    margin: 22px 0 15px;
    font-weight: bold;
}

.draw-btn {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 10px solid #ffd166;
    background: #d62828;
    color: white;
    font-size: 30px;
    font-weight: 900;
    box-shadow: 0 8px 20px rgba(214,40,40,0.35);
    cursor: pointer;
    transition: transform 0.15s;
}

.draw-btn:active {
    transform: scale(0.94);
}

.draw-btn:disabled {
    background: #aaa;
    border-color: #ddd;
    box-shadow: none;
}

.result {
    min-height: 100px;
    margin-top: 25px;
    font-size: 24px;
    font-weight: bold;
}

.prize {
    font-size: 55px;
    color: #d62828;
    display: block;
    margin-top: 5px;
}

.reset-btn {
    display: none;
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #555;
    color: white;
    font-size: 18px;
}

.small {
    margin-top: 25px;
    font-size: 13px;
    color: #999;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">🎉 9月幸運抽獎 🎉</div>
    <div class="subtitle">LUCKY DRAW</div>

    <div class="rule">
        單筆消費每滿
        <strong>$888</strong><br>
        即可獲得 1 次抽獎機會
    </div>

    <div id="setup">

        <input
            type="number"
            id="amount"
            inputmode="numeric"
            placeholder="請輸入消費金額"
        >

        <button class="confirm-btn" onclick="confirmAmount()">
            確認消費金額
        </button>

    </div>

    <div class="chance" id="chance">
        請先輸入消費金額
    </div>

    <button
        class="draw-btn"
        id="drawButton"
        onclick="drawPrize()"
        disabled
    >
        START<br>
        抽獎
    </button>

    <div class="result" id="result"></div>

    <button
        class="reset-btn"
        id="resetButton"
        onclick="nextCustomer()"
    >
        下一位顧客
    </button>

    <div class="small">
        每滿 $888 可抽一次
    </div>

</div>


<script>

let remainingChance = 0;
let isDrawing = false;


// ==========================
// 確認消費金額
// ==========================

function confirmAmount() {

    const amount =
        Number(document.getElementById("amount").value);

    if (!amount || amount < 888) {

        alert("消費金額未滿 $888");

        return;
    }


    remainingChance = Math.floor(amount / 888);


    // 鎖定金額
    document.getElementById("amount").disabled = true;

    document.querySelector(".confirm-btn").disabled = true;


    document.getElementById("chance").innerHTML =
        "本筆共有 <b>" +
        remainingChance +
        "</b> 次抽獎機會";


    document.getElementById("drawButton").disabled = false;


    document.getElementById("result").innerHTML = "";

}


// ==========================
// 抽獎
// ==========================

function drawPrize() {

    if (remainingChance <= 0 || isDrawing) {
        return;
    }


    isDrawing = true;

    const button =
        document.getElementById("drawButton");

    const result =
        document.getElementById("result");


    button.disabled = true;

    result.innerHTML = "✨ 抽獎中... ✨";


    // 讓畫面有抽獎等待感
    setTimeout(function() {


        /*
        機率設定：

        89折 = 70%
        79折 = 15%
        69折 = 10%
        59折 = 5%

        總計 = 100%
        */


        const random = Math.random() * 100;

        let prize;


        if (random < 70) {

            prize = "89 折";

        }

        else if (random < 85) {

            prize = "79 折";

        }

        else if (random < 95) {

            prize = "69 折";

        }

        else {

            prize = "59 折";

        }


        remainingChance--;


        result.innerHTML =
            "🎊 恭喜獲得 🎊" +
            "<span class='prize'>" +
            prize +
            "</span>";


        if (remainingChance > 0) {

            document.getElementById("chance").innerHTML =
                "還可以抽 <b>" +
                remainingChance +
                "</b> 次";


            button.disabled = false;

        }

        else {

            document.getElementById("chance").innerHTML =
                "本筆抽獎已完成";


            document.getElementById("resetButton").style.display =
                "block";

        }


        isDrawing = false;


    }, 1500);

}


// ==========================
// 下一位客人
// ==========================

function nextCustomer() {

    remainingChance = 0;


    document.getElementById("amount").value = "";

    document.getElementById("amount").disabled = false;

    document.querySelector(".confirm-btn").disabled = false;


    document.getElementById("chance").innerHTML =
        "請先輸入消費金額";


    document.getElementById("result").innerHTML = "";


    document.getElementById("drawButton").disabled = true;


    document.getElementById("resetButton").style.display =
        "none";

}

</script>

</body>
</html>
